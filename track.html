<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Track Shipment | Global Touch Courier</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brandBlue: '#1E3A8A',
                        brandRed: '#DC2626',
                        brandDark: '#0F172A'
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen flex flex-col">

    <!-- Navigation Header -->
    <header class="bg-brandRed shadow-md sticky top-0 z-50 border-b border-red-800">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <a href="index.html" class="flex items-center space-x-3 bg-gray-900/90 px-3.5 py-2 rounded-xl border border-gray-800 shadow-md">
                <img src="logo global.png" alt="Logo" class="h-9 sm:h-11 w-auto object-contain brightness-0 invert">
            </a>
            
            <nav class="hidden md:flex space-x-8 font-semibold text-sm">
                <a href="index.html" class="text-red-100 hover:text-white transition">Home</a>
                <a href="services.html" class="text-red-100 hover:text-white transition">Services</a>
                <a href="track.html" class="text-white hover:text-gray-200 transition">Track Shipment</a>
                <a href="quote.html" class="text-red-100 hover:text-white transition">Get a Quote</a>
                <a href="contact.html" class="text-red-100 hover:text-white transition">Contact Us</a>
            </nav>

            <div class="hidden md:flex items-center space-x-3">
                <a href="track.html" class="bg-brandBlue hover:bg-blue-900 text-white px-5 py-2.5 rounded-lg font-medium text-sm transition shadow-lg shadow-black/20">
                    <i class="fa fa-box-open mr-1.5"></i> Track Package
                </a>
            </div>

            <button onclick="toggleMobileMenu()" class="md:hidden text-white text-2xl focus:outline-none p-1">
                <i id="menuIcon" class="fa fa-bars"></i>
            </button>
        </div>

        <div id="mobileMenu" class="hidden md:hidden bg-brandRed border-t border-red-700 px-4 pt-3 pb-6 space-y-3 shadow-xl">
            <a href="index.html" class="block text-red-100 font-semibold py-2 border-b border-red-700/60">Home</a>
            <a href="services.html" class="block text-red-100 font-semibold py-2 border-b border-red-700/60">Services</a>
            <a href="track.html" class="block text-white font-bold py-2 border-b border-red-700/60">Track Shipment</a>
            <a href="quote.html" class="block text-red-100 font-semibold py-2 border-b border-red-700/60">Get a Quote</a>
            <a href="contact.html" class="block text-red-100 font-semibold py-2">Contact Us</a>
        </div>
    </header>

    <!-- Page Title Banner -->
    <section class="bg-brandDark text-white py-12 px-4 text-center">
        <h1 class="text-3xl font-black">Consignment Tracker</h1>
        <p class="text-gray-400 text-xs sm:text-sm mt-2">Monitor exact checkpoint logs and real-time delivery projections.</p>
    </section>

    <!-- Track Input & Result Section -->
    <main class="max-w-4xl mx-auto px-4 py-10 flex-1 w-full space-y-8">
        <div class="bg-white p-6 sm:p-8 rounded-3xl shadow-lg border border-gray-200">
            <label class="block text-xs font-bold uppercase tracking-wider text-gray-600 mb-2">Enter Tracking Number</label>
            <div class="flex flex-col sm:flex-row gap-3">
                <input type="text" id="mainTrackingInput" placeholder="e.g. GT-984210" class="flex-1 border border-gray-300 rounded-xl px-4 py-3.5 focus:outline-none focus:border-brandBlue uppercase font-mono text-sm">
                <button onclick="executeAdvancedTracking()" class="bg-brandBlue hover:bg-blue-900 text-white px-8 py-3.5 rounded-xl font-bold transition flex items-center justify-center text-sm shadow-md">
                    <i class="fa fa-search mr-2"></i> Track Consignment
                </button>
            </div>
        </div>

        <!-- Detailed Result Display Container -->
        <div id="advancedTrackingResult" class="hidden space-y-6"></div>
    </main>

    <!-- Footer -->
    <footer class="bg-brandDark text-white py-12 px-4 mt-auto">
        <div class="max-w-7xl mx-auto text-center text-xs text-gray-400">
            &copy; 2026 Global Touch Courier. All rights reserved.
        </div>
    </footer>

    <!-- Interactive Scripts -->
    <script>
        function toggleMobileMenu() {
            const menu = document.getElementById('mobileMenu');
            const icon = document.getElementById('menuIcon');
            if (menu.classList.contains('hidden')) {
                menu.classList.remove('hidden');
                icon.classList.remove('fa-bars');
                icon.classList.add('fa-xmark');
            } else {
                menu.classList.add('hidden');
                icon.classList.remove('fa-xmark');
                icon.classList.add('fa-bars');
            }
        }

        function getPublicDatabase() {
            const customData = localStorage.getItem('gt_shipments_db');
            if (customData) {
                return JSON.parse(customData);
            }
            return {
                "GT-984210": {
                    sender: "Sarah Jenkins (New York, USA)",
                    recipient: "Michael Chen (London, UK)",
                    service: "Air Freight Express",
                    status: "In Transit",
                    currentLocation: "Heathrow Hub, London",
                    estimatedDelivery: "June 20, 2026",
                    history: [
                        { date: "June 16, 2026 - 08:30 AM", status: "Package Received at Origin Facility", location: "New York JFK Cargo Terminal" },
                        { date: "June 17, 2026 - 14:15 PM", status: "Departed Origin Country", location: "JFK Airport Flight #GT-402" },
                        { date: "June 18, 2026 - 09:00 AM", status: "Arrived at Destination Hub", location: "Heathrow Hub, London" }
                    ]
                },
                "GT-102938": {
                    sender: "TechCorp Logistics (Berlin, Germany)",
                    recipient: "Global Solutions (Paris, France)",
                    service: "Ground Road Delivery",
                    status: "Out for Delivery",
                    currentLocation: "Paris Local Distribution Centre",
                    estimatedDelivery: "Today by 4:00 PM",
                    history: [
                        { date: "June 17, 2026 - 10:00 AM", status: "Order Processed", location: "Berlin Warehouse" },
                        { date: "June 18, 2026 - 06:00 AM", status: "Out for Final Delivery", location: "Paris Local Distribution Centre" }
                    ]
                }
            };
        }

        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const codeParam = urlParams.get('code');
            if (codeParam) {
                document.getElementById('mainTrackingInput').value = codeParam;
                executeAdvancedTracking();
            }
        });

        function executeAdvancedTracking() {
            const codeInput = document.getElementById('mainTrackingInput').value.trim().toUpperCase();
            const resultContainer = document.getElementById('advancedTrackingResult');

            if (!codeInput) {
                alert("Please enter a consignment code.");
                return;
            }

            const db = getPublicDatabase();
            const data = db[codeInput];

            if (data) {
                let timelineHtml = '';
                data.history.forEach((h, index) => {
                    const isLatest = index === data.history.length - 1;
                    timelineHtml += `
                        <div class="relative pl-8 pb-6 border-l-2 ${isLatest ? 'border-brandRed' : 'border-gray-200'}">
                            <div class="absolute -left-[9px] top-0 w-4 h-4 rounded-full ${isLatest ? 'bg-brandRed ring-4 ring-red-100' : 'bg-gray-300'} flex items-center justify-center text-white text-[9px]">
                                ${isLatest ? '<i class="fa fa-check"></i>' : ''}
                            </div>
                            <p class="text-xs font-bold text-gray-400">${h.date}</p>
                            <p class="text-sm font-bold text-brandBlue mt-0.5">${h.status}</p>
                            <p class="text-xs text-gray-600 mt-1"><i class="fa fa-map-marker-alt text-brandRed mr-1"></i> Location: <strong>${h.location}</strong></p>
                        </div>
                    `;
                });

                resultContainer.innerHTML = `
                    <div class="bg-white rounded-3xl shadow-lg border border-gray-200 p-6 sm:p-8">
                        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center border-b border-gray-100 pb-6 gap-4">
                            <div>
                                <span class="text-xs font-bold uppercase tracking-widest text-gray-400">Tracking Code</span>
                                <h2 class="text-2xl font-black text-brandBlue font-mono">${codeInput}</h2>
                            </div>
                            <span class="bg-red-50 text-brandRed font-extrabold px-4 py-2 rounded-xl text-xs uppercase tracking-wide border border-red-100">
                                <i class="fa fa-circle-notch fa-spin mr-1.5"></i> ${data.status}
                            </span>
                        </div>

                        <div class="grid grid-cols-1 sm:grid-cols-3 gap-6 py-6 border-b border-gray-100 text-xs">
                            <div>
                                <span class="text-gray-400 block mb-1 uppercase font-bold tracking-wider">Sender Details</span>
                                <strong class="text-gray-900 text-sm">${data.sender}</strong>
                            </div>
                            <div>
                                <span class="text-gray-400 block mb-1 uppercase font-bold tracking-wider">Recipient Details</span>
                                <strong class="text-gray-900 text-sm">${data.recipient}</strong>
                            </div>
                            <div>
                                <span class="text-gray-400 block mb-1 uppercase font-bold tracking-wider">Service Type</span>
                                <strong class="text-gray-900 text-sm">${data.service}</strong>
                            </div>
                        </div>

                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-6 pt-6 text-xs">
                            <div class="bg-blue-50/60 p-4 rounded-2xl border border-blue-100">
                                <span class="text-gray-500 block mb-1 uppercase font-bold tracking-wider">Current Location</span>
                                <strong class="text-brandBlue text-sm"><i class="fa fa-location-arrow text-brandRed mr-1"></i> ${data.currentLocation}</strong>
                            </div>
                            <div class="bg-gray-50 p-4 rounded-2xl border border-gray-200">
                                <span class="text-gray-500 block mb-1 uppercase font-bold tracking-wider">Estimated Delivery</span>
                                <strong class="text-gray-900 text-sm"><i class="fa fa-calendar-days text-brandBlue mr-1"></i> ${data.estimatedDelivery}</strong>
                            </div>
                        </div>
                    </div>

                    <div class="bg-white rounded-3xl shadow-lg border border-gray-200 p-6 sm:p-8">
                        <h3 class="text-lg font-bold text-brandBlue mb-6">Consignment Checkpoint Logs</h3>
                        <div class="space-y-1">
                            ${timelineHtml}
                        </div>
                    </div>
                `;
            } else {
                resultContainer.innerHTML = `
                    <div class="bg-red-50 border border-red-200 text-red-700 p-6 rounded-2xl text-center text-sm">
                        <i class="fa fa-circle-exclamation text-xl mb-2 block"></i>
                        No shipment record found matching code <strong>${codeInput}</strong>. Please check your number or verify with support.
                    </div>
                `;
            }

            resultContainer.classList.remove('hidden');
        }
    </script>
</body>
</html>
